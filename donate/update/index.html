<head>

    <title>Update Your Monthly Gift has moved | Archer Christian Academy</title>
    <!-- /donate/update/ moved to /partner/update/ in October 2026. Little Green Light reminder
         emails link here with the donor's details in the query string
         (?field_6=First&field_7=Last&field_9=email...), so the script redirect carries the full
         query string and hash across; the pre-fill keeps working. Canonical + noindex for search
         engines; meta refresh for browsers without JavaScript. -->

    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/partner/update/">
    <script>window.location.replace('/partner/update/' + window.location.search + window.location.hash);</script>
    <style>body{font-family:Georgia,serif;margin:3rem;color:#2b3440;line-height:1.6}a{color:#1D6ECB}</style>
</head>
<body>
    <p>This page has moved to <a href="/partner/update/">archerchristian.org/partner/update/</a>. If you are not taken there automatically, please follow the link.</p>
</body>
</html>
