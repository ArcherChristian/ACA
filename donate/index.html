<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give to Archer has moved | Archer Christian Academy</title>
    <!-- /donate/ moved to /partner/ in October 2026. GitHub Pages cannot send a real 301, so this
         page does the next best thing: canonical + noindex for search engines, an instant script
         redirect that keeps any #section the visitor was sent to (e.g. /donate/#ways), and a
         meta refresh for browsers without JavaScript. -->
    <link rel="canonical" href="https://archerchristian.org/partner/">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/partner/">
    <script>window.location.replace('/partner/' + window.location.search + window.location.hash);</script>
    <style>body{font-family:Georgia,serif;margin:3rem;color:#2b3440;line-height:1.6}a{color:#1D6ECB}</style>
</head>
<body>
    <p>Our giving page has moved to <a href="/partner/">archerchristian.org/partner/</a>. If you are not taken there automatically, please follow the link.</p>
</body>
</html>
